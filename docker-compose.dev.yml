# Local development database only — the app itself runs on the host via `pnpm dev`.
# The production stack lives in docker-compose.yml.
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml exec postgres psql -U saveit -c 'CREATE DATABASE saveit_test;'
#
# saveit_test is required by TEST_DATABASE_URL: tests/setup.ts TRUNCATEs every table
# in beforeEach, so it must never point at the same database as DATABASE_URL.

services:
    postgres:
        image: postgres:16-alpine
        container_name: saveit-postgres-dev
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-saveit}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
            POSTGRES_DB: ${POSTGRES_DB:-saveit}
        ports:
            - "5432:5432"
        volumes:
            - saveit-pgdata-dev:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saveit} -d ${POSTGRES_DB:-saveit}"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

volumes:
    saveit-pgdata-dev:
