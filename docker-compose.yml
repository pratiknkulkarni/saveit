services:
  db:
    image: postgres:16
    restart: always
    container_name: saveit_database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      primary:
        ipv4_address: 172.18.1.15
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    expose:
      - 5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U saveit_user -d saveit_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saveit_application
    command: sh -c "bunx prisma migrate deploy && bun start"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - primary
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./.env:/app/.env

volumes:
  db_data:


networks:
  primary:
    external: true
